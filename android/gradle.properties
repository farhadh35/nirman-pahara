# 3G, not 8G. This machine has 16 GB and swap turned off, so when memory
# runs out the kernel cannot page — it kills the biggest process. An 8G
# heap plus a 4G metaspace let one Gradle JVM ask for twelve, and release
# builds died with "finished with non-zero exit value 137" rather than any
# compiler error. Raise this only alongside swap or more RAM.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
