name: nirman_pahara
description: "নির্মাণ পাহারা — Bangla civil works monitoring guide for non-engineers (Bangladesh)"
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  share_plus: ^12.0.0
  geolocator: ^14.0.2
  pdf: ^3.11.3
  file_picker: ^10.3.4
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/content/guide/
    - assets/content/guide/modules/
    - assets/content/checklists/
    - assets/content/lookups/
    - assets/content/rates/
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
